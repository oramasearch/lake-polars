# SPDX-License-Identifier: MIT
# gitleaks configuration: the default rules, plus the one example token the docs use on purpose
# (`make run` sets it for a local server; it is not a credential anywhere).

[extend]
useDefault = true

[[allowlists]]
description = "the example bearer token of `make run` and the README"
regexes = ['''local-dev-token''']
