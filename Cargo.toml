[package]
name = "lake-polars"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"
description = "lake-polars, powered by Polars: the web service behind lake's polars service kind"

[dependencies]
polars = { version = "=0.55.2", default-features = false, features = ["lazy", "sql", "parquet", "csv", "json", "dtype-full", "temporal", "strings", "timezones"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
subtle = "=2.6.1"
http-body-util = "=0.1.3"
# The same sqlparser release polars-sql 0.55.2 parses with, for the sandbox (src/sandbox.rs).
sqlparser = { version = "=0.62.0", features = ["visitor"] }

[dev-dependencies]
tempfile = "=3.27.0"
tower = { version = "=0.5.2", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
